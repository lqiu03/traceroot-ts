name: Publish to npm

on:
  release:
    types: [published]

jobs:
  # Triggered by tags like: v0.1.1, v1.0.0
  publish-traceroot:
    if: "!startsWith(github.event.release.tag_name, 'mastra-') && !startsWith(github.event.release.tag_name, 'pi-')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation via OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast — verify tag matches package.json before running build/tests
      - name: Verify release tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/traceroot/package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $TAG"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm --filter @traceroot-ai/traceroot test

      - name: Publish @traceroot-ai/traceroot
        run: pnpm --filter @traceroot-ai/traceroot publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Triggered by tags like: mastra-v0.1.0, mastra-v1.0.0
  publish-mastra:
    if: startsWith(github.event.release.tag_name, 'mastra-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation via OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast — verify tag matches package.json before running build/tests
      - name: Verify release tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/mastra/package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#mastra-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ packages/mastra/package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $TAG"

      - name: Lint
        run: pnpm --filter @traceroot-ai/mastra lint

      - name: Build
        run: pnpm --filter @traceroot-ai/mastra build

      - name: Publish @traceroot-ai/mastra
        run: pnpm --filter @traceroot-ai/mastra publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Triggered by tags like: pi-v0.1.0, pi-v1.0.0
  #
  # Split into a test job (no id-token) and a publish job (id-token: write
  # only), carrying forward the security hardening from
  # traceroot-pi-extension's own npm-publish.yml: lint/build/test run only
  # here, where no OIDC token is mintable, and the resulting dist/ is passed
  # to publish-pi via artifact upload/download so the id-token-scoped job
  # never runs a build step itself.
  publish-pi-test:
    if: startsWith(github.event.release.tag_name, 'pi-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Fail fast — verify tag matches package.json before running build/tests.
      # The tag is read via env, NOT interpolated into the script: a release
      # tag can contain shell metacharacters (backticks, $(), ;), and textual
      # interpolation would execute them in this job.
      - name: Verify release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/pi/package.json').version")
          TAG_VERSION="${TAG#pi-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ packages/pi/package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $TAG"

      - name: Lint
        run: pnpm --filter @traceroot-ai/pi lint

      - name: Build
        run: pnpm --filter @traceroot-ai/pi build

      - name: Typecheck
        run: pnpm --filter @traceroot-ai/pi typecheck

      - name: Test
        run: pnpm --filter @traceroot-ai/pi test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-dist
          path: packages/pi/dist
          if-no-files-found: error
          retention-days: 1

  # Publish with id-token: write in scope ONLY here. This job runs no
  # third-party build/lint/test code while the token is available: install
  # uses --ignore-scripts (no lifecycle scripts) and dist/ is downloaded
  # as an artifact built by publish-pi-test (which has no id-token), rather
  # than rebuilt here, so nothing between the token grant and `pnpm publish`
  # can read ACTIONS_ID_TOKEN_REQUEST_* and mint a forged provenance token.
  publish-pi:
    needs: publish-pi-test
    if: startsWith(github.event.release.tag_name, 'pi-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation via OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: pi-dist
          path: packages/pi/dist

      - name: Publish @traceroot-ai/pi
        run: pnpm --filter @traceroot-ai/pi publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
